# Локальный стенд для ELT-пайплайна: HDFS + Spark standalone + Airflow + Jupyter.
#   docker compose up -d --build
# UI:  Airflow http://localhost:8080 (admin/admin) | HDFS http://localhost:9870
#      Spark  http://localhost:8081                | Jupyter http://localhost:8888

x-airflow-common: &airflow-common
  image: nf-airflow-spark:latest
  env_file: [airflow.env]
  user: "${AIRFLOW_UID:-50000}:0"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------- HDFS ----------------
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    environment:
      CLUSTER_NAME: datalake
    env_file: [hadoop.env]
    ports:
      - "9870:9870"   # NameNode UI / WebHDFS
      - "9000:9000"   # RPC
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9870/webhdfs/v1/?op=GETFILESTATUS"]
      interval: 10s
      retries: 20

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
    env_file: [hadoop.env]
    ports:
      - "9864:9864"   # DataNode HTTP (WebHDFS redirect target)
    volumes:
      - hdfs_datanode:/hadoop/dfs/data
    depends_on: [namenode]

  # ---------------- Spark standalone ----------------
  spark-master:
    image: apache/spark:3.5.4-scala2.12-java17-python3-ubuntu
    container_name: spark-master
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "8081:8080"   # Spark Master UI
      - "7077:7077"

  spark-worker:
    image: apache/spark:3.5.4-scala2.12-java17-python3-ubuntu
    container_name: spark-worker
    hostname: spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: "${SPARK_WORKER_CORES:-6}"
      SPARK_WORKER_MEMORY: "${SPARK_WORKER_MEMORY:-5g}"
      SPARK_WORKER_DIR: /tmp/spark-worker
      HADOOP_USER_NAME: root
    ports:
      - "8082:8081"   # Spark Worker UI
    depends_on: [spark-master]

  # ---------------- Airflow ----------------
  postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    build: ./docker/airflow
    container_name: airflow-init
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --role Admin --username admin --password admin \
          --firstname Admin --lastname Admin --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    hostname: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------- Jupyter (аналитика) ----------------
  jupyter:
    build: ./docker/jupyter
    image: nf-jupyter-spark:latest
    container_name: jupyter
    hostname: jupyter
    user: "${AIRFLOW_UID:-1000}:0"
    environment:
      HADOOP_USER_NAME: root
      SPARK_MASTER: spark://spark-master:7077
      HDFS_URI: hdfs://namenode:9000
      WEBHDFS_URL: http://namenode:9870
      DATALAKE_ROOT: /datalake
    ports:
      - "8888:8888"
      - "4040:4040"   # Spark UI приложения из ноутбука
    volumes:
      - ./notebooks:/opt/notebooks
      - ./pipeline:/opt/src/pipeline
    depends_on: [spark-master, namenode]

volumes:
  hdfs_namenode:
  hdfs_datanode:
  airflow_pg:
